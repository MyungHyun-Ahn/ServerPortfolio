EchoServer:
  Backend: Iocp
  BindIp: 127.0.0.1
  Port: 19000
  WorkerThreadCount: 2
  MaxSessionCount: 512
  RecvBufferSize: 1024
  LogMinimumLevel: Info
  LogOutputDirectory: ""
  LogConsoleEnabled: true
  LogFileEnabled: true
  LogIncludeThreadId: true
  PacketKey: 55
  EnablePagePool: true
  PageSize: 4096
  SendThreadCount: 1
  ResponsesPerThread: 1
  RoomCount: 50
  RoomCapacity: 4

Debug:
  ManualDump: false
  Headless: false
  BootstrapTrace: false
  TraceUserId: 0
  LogPackets: false
  TransitionRaceInjectionEnabled: false
  TransitionRaceInjectionMode: None
  PostRoomChangeRaceInjectionEnabled: false
  PostRoomChangeRaceInjectionMode: None
  FirstEchoRaceInjectionEnabled: false
  FirstEchoRaceInjectionMode: None
  ContentsRaceInjectionEnabled: false
  ContentsRaceInjectionPeriod: 100
  ContentsRaceInjectionMode: None
  ContentsFailFast: false
