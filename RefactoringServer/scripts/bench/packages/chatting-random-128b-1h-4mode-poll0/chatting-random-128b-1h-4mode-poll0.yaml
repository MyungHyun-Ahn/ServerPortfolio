Scenario: Chatting
OutputRoot: Out/bench
ContinueOnError: true

Defaults:
  Timing:
    WarmupSeconds: 0
    MeasureSeconds: 3600
    CooldownSeconds: 0
    StartupTimeoutSeconds: 15
    RunTimeoutSeconds: 3660
  Server:
    Executable: Out/ChattingServer/ChattingServer.exe
    ConfigTemplate: Config/Server/ChattingServer.yaml
    Overrides:
      ChattingServer.Port: 19100
      ChattingServer.MaxSessionCount: 384
      ChattingServer.WorkerThreadCount: 4
      ChattingServer.ContentsWorkerThreadCount: 4
      ChattingServer.RoomCount: 20
      ChattingServer.RoomCapacity: 256
      ChattingServer.MaxChatPayloadBytes: 256
      ChattingServer.RioSendRingSizeBytes: 65536
      Debug.Headless: true
  Client:
    Executable: Out/ChattingDummyClient/ChattingDummyClient.exe
    ConfigTemplate: Config/Client/ChattingDummy.yaml
    Overrides:
      ChattingDummy.ServerIp: 127.0.0.1
      ChattingDummy.Port: 19100
      ChattingDummy.PacketKey: 55
      ChattingDummy.WorkerThreadCount: 4
      ChattingDummy.SessionCount: 250
      ChattingDummy.ConnectsPerSecond: 20
      ChattingDummy.SendIntervalMs: 0
      ChattingDummy.PayloadSizeBytes: 128
      ChattingDummy.RoomSelectionMode: Random
      ChattingDummy.HotspotRoomIds: "77"
      ChattingDummy.HotspotBiasPercent: 80
      ChattingDummy.RoomChangeProbabilityPercent: 0
      ChattingDummy.ReconnectProbabilityPercent: 0
      ChattingDummy.ReconnectDelayMs: 100
      ChattingDummy.ResponseTimeoutMs: 10000
      ChattingDummy.ConsoleSummaryIntervalSeconds: 60
      ChattingDummy.EventPollMaxCount: 0

Runs:
  - Name: iocp_default_128b_250_random_1h
    Tags: [iocp, default, random, payload-128b, one-hour, poll0]
    Server:
      Overrides:
        ChattingServer.Backend: Iocp
        ChattingServer.RioSendDispatchMode: Direct
        ChattingServer.SocketSendBufferBytes: -1

  - Name: iocp_sndbuf0_128b_250_random_1h
    Tags: [iocp, sndbuf0, random, payload-128b, one-hour, poll0]
    Server:
      Overrides:
        ChattingServer.Backend: Iocp
        ChattingServer.RioSendDispatchMode: Direct
        ChattingServer.SocketSendBufferBytes: 0

  - Name: rio_direct_128b_250_random_1h
    Tags: [rio, direct, random, payload-128b, one-hour, poll0]
    Server:
      Overrides:
        ChattingServer.Backend: Rio
        ChattingServer.RioSendDispatchMode: Direct
        ChattingServer.SocketSendBufferBytes: -1

  - Name: rio_owner_128b_250_random_1h
    Tags: [rio, owner-thread, random, payload-128b, one-hour, poll0]
    Server:
      Overrides:
        ChattingServer.Backend: Rio
        ChattingServer.RioSendDispatchMode: OwnerThread
        ChattingServer.SocketSendBufferBytes: -1

