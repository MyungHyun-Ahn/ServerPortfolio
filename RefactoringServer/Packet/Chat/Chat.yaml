content: Chat

messages:
  - name: RoomSnapshot
    rq:
      opcode: 3000
      fields:
        - { name: roomId, type: uint32 }
    rp:
      opcode: 3001
      fields:
        - { name: roomId, type: uint32 }
        - { name: participants, type: vector<string> }
        - { name: unreadCounts, type: "map<string, uint32>" }
        - { name: metadata, type: "unordered_map<string, string>" }
  - name: RoomBinarySnapshot
    noti:
      opcode: 3002
      fields:
        - { name: roomId, type: uint32 }
        - { name: payload, type: bytes_view }
