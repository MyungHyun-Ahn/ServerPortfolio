services:
  account-mysql:
    image: mysql:8.0
    container_name: refactoringserver-account-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: accountdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: appuser1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - account_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -proot1234
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - login-platform-net

  chat-redis:
    image: redis:7.2-alpine
    container_name: refactoringserver-chat-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --save
      - "60"
      - "1"
    ports:
      - "6379:6379"
    volumes:
      - chat_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - login-platform-net

networks:
  login-platform-net:
    driver: bridge

volumes:
  account_mysql_data:
  chat_redis_data:
